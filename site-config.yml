site:
  name: "frogworks404"
  preview_url: ""

media:
  public_path: "/uploads"
  upload_dir: "static/uploads"

content_types:
  log:
    label: "記録エントリ"
    folder: "content/log"
    sort: "date_desc"

    list_columns:
      - key: "date"
        label: "日付"
      - key: "title"
        label: "タイトル"
      - key: "extra.entry_type"
        label: "タイプ"

    fields:
      - key: "title"
        type: "text"
        label: "タイトル"
        required: true
        placeholder: "エントリのタイトル"

      - key: "date"
        type: "date"
        label: "公開日"
        default: "today"

      - key: "draft"
        type: "toggle"
        label: "下書き"
        default: false

      - key: "description"
        type: "textarea"
        label: "概要"
        rows: 3
        placeholder: "エントリの概要（フィードカードに表示）"

      - key: "extra.entry_type"
        type: "select"
        label: "エントリタイプ"
        options:
          - value: "essay"
            label: "エッセイ（主張・考察）"
          - value: "experiment"
            label: "実験記録（試行・結果）"
          - value: "update"
            label: "アップデート（短い進捗）"
          - value: "project"
            label: "プロジェクト紹介"
        default: "essay"

      - key: "_content"
        type: "markdown"
        label: "本文"

      - key: "extra.status"
        type: "select"
        label: "プロジェクトステータス"
        options:
          - value: "in-operation"
            label: "継続運用中"
          - value: "usable"
            label: "利用可能"
          - value: "prototype"
            label: "試作"
          - value: "concept"
            label: "構想"
          - value: "tech-verify"
            label: "技術検証"
          - value: "paused"
            label: "休止"
        default: "concept"

      - key: "extra.project_slug"
        type: "text"
        label: "関連プロジェクトslug"
        placeholder: "例: context-mixer"

      - key: "taxonomies.tags"
        type: "list"
        label: "テーマタグ"
        help: "ai-collaboration / knowledge / developer-tools / interface / hardware / creative-tools"

  projects:
    label: "プロジェクト"
    folder: "content/projects"
    sort: "date_desc"

    list_columns:
      - key: "title"
        label: "タイトル"
      - key: "extra.status"
        label: "ステータス"

    fields:
      - key: "title"
        type: "text"
        label: "プロジェクト名"
        required: true

      - key: "date"
        type: "date"
        label: "公開日"
        default: "today"

      - key: "draft"
        type: "toggle"
        label: "下書き"
        default: false

      - key: "description"
        type: "textarea"
        label: "概要"
        rows: 3
        placeholder: "プロジェクトの概要（一覧・詳細ページに表示）"

      - key: "template"
        type: "text"
        label: "テンプレート"
        default: "pages/project.html"
        readonly: true

      - key: "slug"
        type: "text"
        label: "カスタムURL"
        placeholder: "halfgrip"
        help: "未入力の場合はタイトルから自動生成されます"

      - key: "extra.entry_type"
        type: "hidden"
        label: "エントリタイプ"
        default: "project"

      - key: "extra.project"
        type: "hidden"
        label: "プロジェクトフラグ"
        default: true

      - key: "extra.status"
        type: "select"
        label: "プロジェクトステータス"
        options:
          - value: "in-operation"
            label: "継続運用中"
          - value: "usable"
            label: "利用可能"
          - value: "prototype"
            label: "試作"
          - value: "concept"
            label: "構想"
          - value: "tech-verify"
            label: "技術検証"
          - value: "paused"
            label: "休止"
        default: "concept"

      - key: "extra.featured"
        type: "toggle"
        label: "ピックアップ表示"
        default: false
        help: "TOPのピックアッププロジェクトに表示します"

      - key: "extra.cover_image"
        type: "image"
        label: "キャッチ画像"
        help: "プロジェクトのカバー画像（一覧・詳細ページに表示）"

      - key: "extra.thumbnail"
        type: "image"
        label: "サムネイル画像"
        help: "一覧ページの右側に表示する縦長画像"

      - key: "extra.github_url"
        type: "text"
        label: "GitHub URL"
        placeholder: "https://github.com/..."

      - key: "extra.demo_url"
        type: "text"
        label: "デモ／サイトURL"
        placeholder: "https://..."

      - key: "extra.docs_url"
        type: "text"
        label: "ドキュメントURL"
        placeholder: "https://..."

      - key: "taxonomies.tags"
        type: "list"
        label: "テーマタグ"
        help: "ai-collaboration / knowledge / developer-tools / interface / hardware / creative-tools"

      - key: "_content"
        type: "markdown"
        label: "本文"

  pages:
    label: "固定ページ"
    folder: "content/pages"

    fields:
      - key: "title"
        type: "text"
        label: "ページタイトル"
        required: true

      - key: "description"
        type: "textarea"
        label: "概要 (SEO)"
        rows: 2

      - key: "template"
        type: "text"
        label: "テンプレート"
        default: "pages/page.html"
        readonly: true

      - key: "slug"
        type: "text"
        label: "カスタムURL"
        placeholder: "about"
        help: "未入力の場合はタイトルから自動生成されます"

      - key: "date"
        type: "date"
        label: "公開日"
        default: "today"

      - key: "draft"
        type: "toggle"
        label: "下書き"
        default: false

      - key: "_content"
        type: "markdown"
        label: "本文"

site_settings:
  target_file: "config.toml"
  format: "toml"
  groups:
    - id: "basic"
      label: "基本設定"
      fields:
        - key: "title"
          label: "サイトタイトル"
          type: "text"
          required: true
        - key: "description"
          label: "サイト説明"
          type: "textarea"
        - key: "base_url"
          label: "ベースURL"
          type: "text"
          readonly: true

    - id: "profile"
      label: "プロフィール"
      fields:
        - key: "extra.start_date"
          label: "記録開始日"
          type: "text"
          placeholder: "例: 2024.01"
        - key: "extra.github"
          label: "GitHub URL"
          type: "text"
        - key: "extra.x"
          label: "X (Twitter) URL"
          type: "text"
        - key: "extra.booth"
          label: "BOOTH URL"
          type: "text"

    - id: "analytics"
      label: "アナリティクス"
      fields:
        - key: "extra.analytics_provider"
          label: "プロバイダ"
          type: "select"
          options: ["none", "google", "plausible"]
          default: "none"
          help: "Google Analytics または Plausible を選択"

        - key: "extra.analytics_google_id"
          label: "Google Analytics 測定ID"
          type: "text"
          placeholder: "例: G-XXXXXXXXXX"
          help: "GA4の測定ID（プロバイダをgoogleに設定時に有効）"

        - key: "extra.analytics_plausible_domain"
          label: "Plausible ドメイン"
          type: "text"
          placeholder: "例: frogworks404.dev"
          help: "Plausibleに登録したドメイン（プロバイダをplausibleに設定時に有効）"
